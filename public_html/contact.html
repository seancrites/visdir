<!DOCTYPE html>
<html lang="en" class="dark">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="generator" content="visdir">
   <meta name="version" content="1.5.0">
   <meta name="description"
      content="Secure contact form with optional CAPTCHA (Cloudflare Turnstile, reCAPTCHA v3, hCaptcha) and layered anti-spam protection.">
   <meta property="og:title" content="Contact — Visual Directory">
   <meta property="og:description" content="Send us a message through our spam-resistant contact form.">
   <meta property="og:type" content="website">
   <meta property="og:url" content="https://yourdomain.com/contact.html">

   <link rel="canonical" href="https://yourdomain.com/contact.html">

   <title>Contact — Visual Directory</title>

   <script src="https://cdn.tailwindcss.com"></script>
   <script>
      tailwind.config = {
         darkMode: 'class'
      }
   </script>

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

   <style>
      .form-input {
         transition: all 0.2s;
      }

      .form-input:focus {
         box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3);
      }
   </style>

   <!-- ==================== CAPTCHA OPTIONS (choose ONE) ==================== -->

   <!-- Option 1: Cloudflare Turnstile (Recommended - privacy friendly) -->
   <!-- CLOUDFLARE-TURNSTILE-BEGIN
   <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
   CLOUDFLARE-TURNSTILE-END -->

   <!-- Option 2: Google reCAPTCHA v3 (Invisible) -->
   <!-- GOOGLE-RECAPTCHA-V3-BEGIN
   <script src="https://www.google.com/recaptcha/api.js?render=YOUR_SITE_KEY_HERE"></script>
   GOOGLE-RECAPTCHA-V3-END -->

   <!-- Option 3: hCaptcha -->
   <!-- HCAPTCHA-BEGIN
   <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
   HCAPTCHA-END -->
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans">

   <!-- NAV -->
   <nav class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
         <div class="flex items-center gap-x-3" id="nav-brand"></div>
         <div class="flex items-center gap-x-8">
            <a href="index.html" class="hover:text-amber-600 font-medium">Directory</a>
            <a href="map.html" class="hover:text-amber-600 font-medium">Map</a>
            <a href="contact.html" class="text-amber-600 font-medium">Contact</a>
            <button onclick="toggleDarkMode()"
               class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition"
               aria-label="Toggle dark mode">
               <i id="theme-icon" class="fa-solid fa-moon text-slate-600 dark:text-slate-400"></i>
            </button>
         </div>
      </div>
   </nav>

   <div class="max-w-2xl mx-auto px-6 py-16">
      <h1 class="text-4xl font-bold text-center mb-3">Get in Touch</h1>
      <p class="text-center text-slate-600 dark:text-slate-400 mb-10">Have feedback, corrections, or want to add
         something? We'd love to hear from you.</p>

      <div id="status-message" class="hidden mb-8 rounded-2xl p-6 text-center"></div>

      <form action="contact.php" method="POST" class="space-y-6 bg-white dark:bg-slate-900 p-8 rounded-3xl shadow">
         <!-- Anti-Spam Fields -->
         <!-- Honeypot: positioned offscreen, bots love filling these - humans will never see -->
         <input type="text" name="website" style="position:absolute; left:-9999px; opacity:0; pointer-events:none;"
            tabindex="-1" autocomplete="off">

         <!-- Time Gate: populated when page loads, minimum submit delay enforced -->
         <input type="hidden" name="ts" id="ts" value="">

         <div>
            <label class="block text-sm font-medium mb-1">Your Name</label>
            <input type="text" name="name" required
               class="form-input w-full px-5 py-4 rounded-2xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-none">
         </div>

         <div>
            <label class="block text-sm font-medium mb-1">Email Address</label>
            <input type="email" name="email" required
               class="form-input w-full px-5 py-4 rounded-2xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-none">
         </div>

         <div>
            <label class="block text-sm font-medium mb-1">Message</label>
            <textarea name="message" rows="6" required
               class="form-input w-full px-5 py-4 rounded-2xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-none"></textarea>
         </div>

         <!-- ==================== CAPTCHA WIDGETS ==================== -->

         <!-- Cloudflare Turnstile (Recommended) -->
         <!-- CLOUDFLARE-TURNSTILE-BEGIN
         <div class="flex justify-center">
            <div class="cf-turnstile" data-sitekey="YOUR_TURNSTILE_SITEKEY_HERE" data-theme="auto"></div>
         </div>
         CLOUDFLARE-TURNSTILE-END -->

         <!-- Google reCAPTCHA v3 (Invisible) -->
         <!-- GOOGLE-RECAPTCHA-V3-BEGIN
         <input type="hidden" id="recaptcha_token" name="recaptcha_token">
         GOOGLE-RECAPTCHA-V3-END -->

         <!-- hCaptcha -->
         <!-- HCAPTCHA-BEGIN
         <div class="flex justify-center">
            <div class="h-captcha" data-sitekey="YOUR_HCAPTCHA_SITEKEY_HERE"></div>
         </div>
         HCAPTCHA-END -->

         <button type="submit"
            class="w-full bg-slate-900 hover:bg-amber-600 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-amber-600 text-white py-5 rounded-2xl font-semibold text-lg transition">
            Send Message
         </button>
      </form>
   </div>

   <!-- FOOTER -->
   <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-8">
      <div class="max-w-7xl mx-auto px-6 text-center">
         <p id="motto-text" class="text-lg font-medium text-amber-600"></p>
         <p id="footer-text" class="mt-3 text-xs text-slate-500 dark:text-slate-400"></p>
      </div>
   </footer>

   <script>
      function toggleDarkMode() {
         const html = document.documentElement;
         html.classList.toggle('dark');
         localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
         updateThemeIcon();
      }

      function updateThemeIcon() {
         const icon = document.getElementById('theme-icon');
         icon.classList.toggle('fa-moon', !document.documentElement.classList.contains('dark'));
         icon.classList.toggle('fa-sun', document.documentElement.classList.contains('dark'));
      }

      function initTheme() {
         if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
         } else {
            document.documentElement.classList.remove('dark');
         }
         updateThemeIcon();
      }

      fetch('data.json?' + Date.now())
         .then(r => r.json())
         .then(data => {
            const site = data.site || {};

            document.getElementById('nav-brand').innerHTML = `
                    ${site.logo_svg || ''}
                    <h1 class="text-2xl font-bold">${site.name || 'Visual Directory'}</h1>
                `;

            document.getElementById('motto-text').textContent = site.motto || '';

            const maintainer = site.maintainer;
            const showContact = site.show_contact === true;
            const supportUrl = site.support_url;
            const supportLabel = site.support_label;
            const visdirLink = '<a href="https://github.com/seancrites/visdir" target="_blank" class="hover:text-amber-600">Visual Directory</a>';

            const parts = [];
            if (maintainer) {
               parts.push(`Maintained by ${maintainer}`);
            }
            if (showContact) {
               parts.push('<a href="contact.html" class="hover:text-amber-600">Contact</a>');
            }
            if (supportUrl && supportLabel) {
               parts.push(`<a href="${supportUrl}" target="_blank" class="hover:text-amber-600">${supportLabel}</a>`);
            }
            parts.push(`Built with ${visdirLink}`);

            document.getElementById('footer-text').innerHTML = parts.join(' • ');
         });

      function showStatusMessage() {
         const urlParams = new URLSearchParams(window.location.search);
         const status = urlParams.get('status');
         const div = document.getElementById('status-message');

         if (status === 'success') {
            div.className = 'bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300 p-6 rounded-2xl text-center mb-8';
            div.innerHTML = '✅ Thank you! Your message has been sent successfully.';
            div.classList.remove('hidden');
         } else if (status === 'error') {
            div.className = 'bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-300 p-6 rounded-2xl text-center mb-8';
            div.innerHTML = '❌ Sorry, something went wrong. Please try again.';
            div.classList.remove('hidden');
         }
      }

      window.onload = () => {
         initTheme();
         showStatusMessage();

         // Anti-Spam: Set page load timestamp for minimum submission delay check
         document.getElementById('ts').value = Math.floor(Date.now() / 1000);
      };
   </script>

   <!-- Uncomment the block below when using Google reCAPTCHA v3 and add your site key -->
   <!-- GOOGLE-RECAPTCHA-V3-BEGIN
   <script>
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();
        grecaptcha.execute('YOUR_RECAPTCHA_SITE_KEY_HERE', {action: 'submit'})
            .then(function(token) {
                document.getElementById('recaptcha_token').value = token;
                e.target.submit();   // now submit the form
            });
    });
   </script>
   GOOGLE-RECAPTCHA-V3-END -->

</body>

</html>
